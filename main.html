<!DOCTYPE html>
<head>
 	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="icon" href="source/icon/icon.ico" />
 	
	<link href="packer.css" rel="stylesheet" />
 	<link href="vectors.css" rel="stylesheet" />
 	<link href="menu.css" rel="stylesheet" />
 	<link href="coloration.css" rel="stylesheet" />
 	<link href="style.css" rel="stylesheet" />
	
	<title>
		chrono mais gratuit
	</title>
</head>
<body onkeydown=keypress(event)>

<div id="box_all_full" class="style_color_c2 back">
	<div id="box_all_rectangle">
		<div id="box_all_square">
		<!-- .square .<what inside> .<placement> -->
		
		<!-- .menu .<menu name:> -->
			<!-- :mclock -->
			<!-- :mconfig -->
			<!-- :mchoice -->
			<!-- ... -->
			<!-- :mall -->
		
		<!-- .style_<color:> <type:> -->
			<!-- :c1 = main color -->
			<!-- :c2 = second color -->
			<!-- :fill = using atr fill -->
			<!-- :stroke = using atr stroke -->
			<!-- :stroke = using atr stroke -->



		<!-- svg -->
			<div class="square sclock tosvg"><!-- a square -->
				<svg viewBox="0 0 1000 1000" class="ground back">
					<g>
						<!-- alpha elements -->
						<g class="menu mclock">
							<path d="M 500 100 A 400 400 0 1 1 500 900 A 400 400 0 1 1 500 100" fill-opacity="0" stroke="#000f" stroke-width="2"/>
						</g>
						<g class="menu mconfig mchoice">
							<path d="M 100 100 L 900 100 L 900 900 L 100 900 Z" fill-opacity="0" stroke="#000f" stroke-width="2"/>
						</g>

						<!-- dynamic elements -->
						<g class="menu mclock">
							<line class="style_color_c1 stroke" id="vector_dynamic_line" x1="50%" y1="10%" x2="50%" y2="50%"></line>
							<path class="style_color_c1 stroke" id="vector_dynamic_arc" d="M 500 100 A 400 400 0 1 1 500 100"/>
						</g>
					</g>
				</svg>
					
				<svg viewBox="0 0 1000 1000" class="ground fore">
					<g>
						<!-- buttons -->
						<g class="menu mclock">
							<path class="style_color_c1 fill  button open config" d="M 500 750 A 50 50 0 1 1 450 800 L 500 800 Z" onclick="menu_switch(2)"/>
						</g>
						<g class="menu mconfig">
							<path class="style_color_c1 fill  button close config" d="M 500 750 A 50 50 0 1 1 450 800 L 450 750 Z" onclick="menu_switch(1)"/>
							<path class="style_color_c1 fill  button open choice" d="M 200 750 L 300 750 L 250 850 Z" onclick="menu_switch(3)"/>
						</g>
						<g class="menu mchoice">
							<path class="style_color_c1 fill  button close config" d="M 500 750 A 50 50 0 1 1 450 800 L 450 750 Z" onclick="menu_switch(1)"/>
							<path class="style_color_c1 fill  button close choice" d="M 200 850 L 300 850 L 250 750 Z" onclick="menu_switch(2)"/>
						</g>
						<g class="menu mclock">
							<path class="style_color_c1 fill  button start" d="M 470 600 L 550 650 L 470 700 Z" onclick="play()"/>
							<path class="style_color_c1 fill  button continue" d="M 470 600 L 550 650 L 470 700 Z" onclick="play()"/>
							<path class="style_color_c1 fill  button pause" d="M 460 610 L 460 690 L 490 690 L 490 610 Z M 510 610 L 510 690 L 540 690 L 540 610" onclick="play()"/>
						</g>
					</g>
				</svg>
			</div>



		<!-- texts -->
			<div class="square stext tomiddle  menu mclock"><!-- a square -->
				<div class="texter timer">
					<!-- #timer_<element> -->
					<p id="timer_m" class="style_color_c1 text style_size_p1">0</p>
					<p id="timer_wrap1" class="style_color_c1 text style_size_p2">:</p>
					<p id="timer_s" class="style_color_c1 text style_size_p1">00</p>
					<p id="timer_wrap2" class="style_color_c1 text style_size_p2">.</p>
					<p id="timer_ms" class="style_color_c1 text style_size_p3">000</p>
				</div>
			</div>

			<div class="square stext toup  menu mclock"><!-- a square -->
				<div class="marger aa">
				</div>
				<div class="marger ab">
					<div class="texter">
						<p id="text_title" class="style_color_c1 text style_size_h1">
							&#60;INDEV&#62;
						</p>
					</div>
				</div>
				
				<div class="marger ac">
					<div class="texter">
						<p id="text_comment" class="style_color_c1 text style_size_h2">
							&#60;zero&#62;
						</p>
					</div>
				</div>
			</div>

			<div class="square stext tomiddle  menu mconfig mchoice"><!-- a square -->
				<div id="box_config_full">
					<div id="box_config_common">
						<div class="config category">
							<div>
								<!-- main -->
								<button class="choice hover">
								Categorie
								</button>
							</div>
						</div>
						<div class="config advance">
							<label class="switch">
								<input type="checkbox">
								<span class="slider round"></span>
							</label>
						</div>

					</div>
					<!--<div id="itms">-->
					<div id="box_config_itms" class="menu mconfig">
						<!-- js will written here -->
					</div>
					<div id="box_choice_itms" class="menu mchoice">
						<div class="itm">
							<button onclick='config_load([])'>
								timer
							</button>
						</div>
						<div class="itm">
							<button onclick='config_load([new Queue(45000,1,true,"EXERCICE",false,true,"#fffa","#f00"),new Queue(15000,10,true,"REPOS",true,true,"#fffa","#fa0"),new Queue(300000,2,true,"PAUSE",true,true,"#fffa","#0a0")])'>
								sportif - dynamique - 10*(45'/15')
							</button>
						</div>
						<div class="itm">
							<button onclick='config_load([new Queue(60000,5,true,"EXERCICE",false,true,"#fffa","#f00"),new Queue(6000,3,true,"REPOS",true,true,"#fffa","#fa0")])'>
								sportif - gaignage - (5*60')/60'
							</button>
						</div>
						<div class="itm">
							<button onclick='config_load([new Queue(300000,1,true,"NORMAL",false,true,"#fffa","#fa0"),new Queue(120000,1,true,"RAPIDE",true,true,"#fffa","#fa0"),new Queue(180000,3,true,"DOUX",true,true,"#fffa","#3a0")])'>
								sportif - cardio - 420'/180'
							</button>
						</div>
						<div class="itm">
							<button onclick='config_load([new Queue(150000,1,true,"CUSSION",false,true,"#fffa","#fa0")])'>
								cuisine - oeufs à la coque
							</button>
						</div>
						<div class="itm">
							<button onclick='config_load([new Queue(10000,1,true,"PETIT",false,true,"#fffa","#fa0",true,true,true),new Queue(15000,5,true,"GRAND",false,true,"#fffa","#fa0",true,true,true)])'>
								test - 10'/15'
							</button>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</div>

<!-- cat message -->
	<aside>
	<p id="msg_cat">
		-
	</p>
		</br>
	<p id="msg_the" class="neg magenta">
		Chrono mais gratuit
	</p>
	</aside>

</body>

<script type="text/javascript" src="./cat.js"></script>
<script type="text/javascript" src="./main.js"></script>
