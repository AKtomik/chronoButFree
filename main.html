<!DOCTYPE html>
<head>
 	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="icon" href="source/icon/icon.ico" />
 	
	<link href="packer.css" rel="stylesheet" />
 	<link href="vectors.css" rel="stylesheet" />
 	<link href="coloration.css" rel="stylesheet" />
 	<link href="style.css" rel="stylesheet" />
	
	<title>
		chrono mais gratuit
	</title>
</head>
<body onkeydown=chrono_action_press(event)>

<div id="box_full" class="style_c2 back">
<div id="box_rectangle">
<div id="box_square">
<!-- svg -->
	<div class="square Sclock">
	<svg viewBox="0 0 1000 1000">
		
		<!-- alpha elements -->
		<g class="menu first">
			<path d="M 500 100 A 400 400 0 1 1 500 900 A 400 400 0 1 1 500 100" fill-opacity="0" stroke="#000f" stroke-width="2"/>
		</g>
		<g class="menu second">
			<path class="style_c1 stroke" d="M 100 100 L 900 100 L 900 900 L 100 900 Z"/>
		</g>

		<!-- dynamic elements -->
		<g class="menu first">
			<line class="style_c1 stroke" id="vector_dynamic_line" x1="50%" y1="10%" x2="50%" y2="50%"></line>
			<path class="style_c1 stroke" id="vector_dynamic_arc" d="M 500 100 A 400 400 0 1 1 500 100"/>
		</g>
		
		<!-- buttons -->
		<g class="menu last">
			<path class="style_c1 fill button options" d="M 500 750 A 50 50 0 1 1 450 800 L 500 800 Z" onclick="chrono_action_menu()"/>
		</g>
		<g class="menu first">
			<path class="style_c1 fill button start" d="M 470 600 L 550 650 L 470 700 Z" onclick="chrono_action_play()"/>
			<path class="style_c1 fill button continue" d="M 470 600 L 550 650 L 470 700 Z" onclick="chrono_action_play()"/>
			<path class="style_c1 fill button pause" d="M 460 610 L 460 690 L 490 690 L 490 610 Z M 510 610 L 510 690 L 540 690 L 540 610" onclick="chrono_action_play()"/>
		</g>
	</svg>
	</div>



<!-- texts -->
	<div class="square Smiddle menu first">
		<div class="texter timer">
			<p id="timer_m" class="style_c1 text style_size_p1">0</p>
			<p id="timer_wrap1" class="style_c1 text style_size_p2">:</p>
			<p id="timer_s" class="style_c1 text style_size_p1">00</p>
			<p id="timer_wrap2" class="style_c1 text style_size_p2">.</p>
			<p id="timer_ms" class="style_c1 text style_size_p3">000</p>
		</div>
	</div>

	<div class="square Stext menu first">
		<div class="marger a">
		</div>
		<div class="marger b">
			<div class="texter">
				<p id="text_title" class="style_c1 text style_size_h1">
					indev
				</p>
			</div>
		</div>
		
		<div class="marger c">
			<div class="texter">
				<p id="text_comment" class="style_c1 text style_size_h2">
					zero. for now.
				</p>
			</div>
		</div>
	
	</div>
	</div>

</div>
</div>
</div>

<!-- cat message -->
	<aside>
	<p id="msg_cat">
		-
	</p>
	<p id="msg_the" class="neg magenta">
		Chrono mais gratuit
	</p>
	</aside>

</body>

<!--javascripts must be loaded after-->
<script type="text/javascript" src="./cat.js"></script>
<script type="text/javascript" src="./main.js"></script>
