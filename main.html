<!DOCTYPE html>
<head>
 	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

	<link href="packer.css" rel="stylesheet" />

	<title>
		chrono mais gratuit
	</title>
</head>
<body>

<div id="box_full" class="style_c2 back">
<div id="box_rectangle">
<div id="box_square">
<!-- svg -->
	<div class="square Sclock">
	<svg viewBox="0 0 1000 1000">

	<!-- alpha elements -->
		<!--<rect id="vector_alpha_rectangle" x="10%" y="10%" width="80%" height="80%"/>-->
		<!--<circle id="vector_alpha_circle" cx="50%" cy="50%" r="40%"/>-->

	<!-- dynamic elements -->
		<line class="style_c1 stroke" id="vector_dynamic_line" x1="50%" y1="10%" x2="50%" y2="50%"></line>
		<path class="style_c1 stroke" id="vector_dynamic_arc" d="M 500 100 A 400 400 0 1 1 500 100"/>

		<!--<path class="button start" d="M 450 600 L 550 600 L 550 700 L 450 700 Z" onclick="chrono_action_start()"/>-->
		<path class="style_c1 fill button start" d="M 470 600 L 550 650 L 470 700 Z" onclick="chrono_action_start()"/>
		<path class="style_c1 fill button continue" d="M 470 600 L 550 650 L 470 700 Z" onclick="chrono_action_continue()"/>
		<path class="style_c1 fill button pause" d="M 460 610 L 460 690 L 490 690 L 490 610 Z M 510 610 L 510 690 L 540 690 L 540 610" onclick="chrono_action_pause()"/>

	</svg>
	</div>

<!-- texts -->
	<div class="square Smiddle">
		<div class="texter timer">
			<p id="timer_m" class="style_c1 text style_size_p1">0</p>
			<p id="timer_wrap1" class="style_c1 text style_size_p2">:</p>
			<p id="timer_s" class="style_c1 text style_size_p1">00</p>
			<p id="timer_wrap2" class="style_c1 text style_size_p2">.</p>
			<p id="timer_ms" class="style_c1 text style_size_p3">000</p>
		</div>
	</div>

	<div class="square Stext">
		<div class="marger a">
		</div>
		<div class="marger b">
			<div class="texter">
				<p id="text_title" class="style_c1 text style_size_h1">
					indev
				</p>
			</div>
		</div>
		
		<div class="marger c">
			<div class="texter">
				<p id="text_comment" class="style_c1 text style_size_h2">
					zero. for now.
				</p>
			</div>
		</div>
	
	</div>
	</div>

</div>
</div>
</div>

<!-- cat message -->
	<aside>
	<p id="msg_cat">
		-
	</p>
	<p id="msg_the" class="neg magenta">

	</aside>

</body>
