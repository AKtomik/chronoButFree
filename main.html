<!DOCTYPE html>
<head>
 	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="icon" href="source/icon/icon.ico" />
 	
	<link href="packer.css" rel="stylesheet" />
 	<link href="coloration.css" rel="stylesheet" />
 	<link href="vectors.css" rel="stylesheet" />
 	<link href="main.css" rel="stylesheet" />
	
	<title>
		chrono mais gratuit
	</title>
</head>
<body>

<div id="box_full">
<div id="box_rectangle">
<div id="box_square">
<!-- svg -->
	<div class="square Sclock">
	<svg viewBox="0 0 1000 1000">
		  
	<!-- grid -->
		<defs>
			<pattern id="grid_1" width="10" height="10" patternUnits="userSpaceOnUse">
				<rect x="0" y="0" width="10" height="10" fill="none" stroke="#fff"	stroke-width="1"/>
			</pattern>
		</defs>
		<rect x="0" y="0" width="100%" height="100%" fill="url(#grid_1)"/>
		  
		<defs>
			<pattern id="grid_2" width="100" height="100" patternUnits="userSpaceOnUse">
				<rect x="0" y="0" width="100" height="100" fill="none" stroke="#ffff" stroke-width="2"/>
			</pattern>
		</defs>
		<rect x="0" y="0" width="100%" height="100%" fill="url(#grid_2)"/>


	<!-- alpha elements -->
		<rect id="vector_alpha_rectangle" x="10%" y="10%" width="80%" height="80%"/>
		<circle id="vector_alpha_circle" cx="50%" cy="50%" r="40%"/>

	<!-- dynamic elements -->
		<line id="vector_dynamic_line" x1="50%" y1="10%" x2="50%" y2="50%"></line>
		<path id="vector_dynamic_arc" d="M 500 100 A 400 400 0 1 1 500 100"/>

		<!--<path class="button start" d="M 450 600 L 550 600 L 550 700 L 450 700 Z" onclick="chrono_action_start()"/>-->
		<path class="button start" d="M 450 600 L 550 650 L 450 700 Z" onclick="chrono_action_start()"/>
		<path class="button continue" d="M 450 600 L 550 650 L 450 700 Z" onclick="chrono_action_continue()"/>
		<path class="button stop" d="M 470 620 L 470 680 L 490 680 L 490 620 Z M 510 620 L 510 680 L 530 680 L 530 620" onclick="chrono_action_stop()"/>

	</svg>
	</div>

<!-- texts -->
	<div class="square Stext">

	<div class="text_box super">
		<div class="texter">
		<p id="text_title" class="neg white">
			indev
		</p>
		</div>
	</div>

	<div class="text_box middle">
	<!-- timer -->
		<div class="texter">
			<p id="timer_m" class="neg white">0</p>
			<p id="timer_wrap1" class="neg white">:</p>
			<p id="timer_s" class="neg white">00</p>
			<p id="timer_wrap2" class="neg white">.</p>
			<p id="timer_ms" class="neg white">000</p>
		</div>
	</div>
	
	<div class="text_box sub">
		<div class="texter">
		<p id="text_comment" class="neg white">
			zero. for now.
		</p>
		</div>
	</div>
	
	</div>
	</div>

</div>
</div>
</div>

<!-- cat message -->
	<aside>
	<p id="msg_cat">
		-
	</p>
	<p id="msg_the" class="neg magenta">
		Chrono mais gratuit
	</p>
	</aside>

</body>

<!--javascripts must be loaded after-->
<script type="text/javascript" src="./cat.js"></script>
<script type="text/javascript" src="./main.js"></script>
